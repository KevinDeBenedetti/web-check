# ==============================================================================
# Web-Check Security Scanner - Docker Compose Configuration
# ==============================================================================
# Usage:
#   Start:  make start            (or: docker compose up -d)
#   Dev:    make dev              (live code reload, see docker-compose.dev.yml)
#   Tools:  docker compose --profile tools up -d
#
# Scanner images are pinned; Dependabot (docker-compose ecosystem) bumps them.
#
# Copy .env.example to .env and customize as needed

services:
  # ==========================================================================
  # API Server
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-check-api
    # Non-root. On Linux set APP_UID/APP_GID to your `id -u`/`id -g` so the
    # bind-mounted ./outputs and ./data are writable (`make start` does it).
    user: "${APP_UID:-10001}:${APP_GID:-100}"
    # Group owning /var/run/docker.sock inside the container (`make start` detects it).
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      # Bound to localhost by default — set API_BIND=0.0.0.0 (and API_KEY!) to expose it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./outputs:/app/outputs:rw
      - ./data:/app/data:rw
      - ./apps/config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOME=/tmp  # writable whatever APP_UID is (sqlmap/wapiti keep state in $HOME)
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DOCKER_NETWORK=${DOCKER_NETWORK:-scanner-net}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-example.com}
      - ALLOW_PRIVATE_TARGETS=${ALLOW_PRIVATE_TARGETS:-false}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ZAP_HOST=zap
      - ZAP_PORT=8090
      - ZAP_API_KEY=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env (e.g. openssl rand -hex 32)}
    networks:
      - scanner-net
    restart: unless-stopped
    depends_on:
      zap:
        condition: service_healthy
      nuclei:
        condition: service_started
      nikto:
        condition: service_started

  # ==========================================================================
  # Security Scanners
  # ==========================================================================

  # ZAP (OWASP Zed Attack Proxy)
  zap:
    image: zaproxy/zap-stable:2.17.0
    container_name: security-scanner-zap
    volumes:
      - ./outputs:/zap/wrk:rw
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:?ZAP_API_KEY must be set in .env (e.g. openssl rand -hex 32)}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    networks:
      - scanner-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nuclei (Vulnerability Scanner)
  nuclei:
    image: projectdiscovery/nuclei:v3.11.1
    container_name: security-scanner-nuclei
    volumes:
      - ./outputs:/output:rw
      - nuclei-templates:/root/nuclei-templates
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    networks:
      - scanner-net
    restart: unless-stopped

  # Nikto (Web Server Scanner) — amd64 only, runs via Rosetta on Apple Silicon
  nikto:
    image: alpine/nikto:2.2.0
    platform: linux/amd64
    container_name: security-scanner-nikto
    volumes:
      - ./outputs:/output:rw
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    networks:
      - scanner-net
    restart: unless-stopped

  # FFuf (Fuzzer)
  ffuf:
    image: secsi/ffuf:2.3.0
    container_name: security-scanner-ffuf
    volumes:
      - ./outputs:/output:rw
      - ./apps/config/wordlists:/wordlists:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    networks:
      - scanner-net
    restart: unless-stopped
    profiles:
      - tools

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  nuclei-templates:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  scanner-net:
    name: ${DOCKER_NETWORK:-scanner-net}
    driver: bridge
