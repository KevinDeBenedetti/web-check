# ==============================================================================
# Web-Check Security Scanner - Docker Compose Configuration
# ==============================================================================
# Usage:
#   Start:  make start            (or: docker compose up -d)
#   Dev:    make dev              (live code reload, see docker-compose.dev.yml)
#   Tools:  docker compose --profile tools up -d
#
# Scanner images are pinned; Renovate (renovate.json) bumps them.
#
# Copy .env.example to .env and customize as needed

# Fixed project name: the containers have fixed names too, so every checkout and
# git worktree must share one project rather than one named after its folder.
name: web-check

services:
  # ==========================================================================
  # API Server
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-check-api
    # Non-root. On Linux set APP_UID/APP_GID to your `id -u`/`id -g` so the
    # bind-mounted ./outputs and ./data are writable (`make start` does it).
    user: "${APP_UID:-10001}:${APP_GID:-100}"
    # Group owning /var/run/docker.sock inside the container (`make start` detects it).
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      # Bound to localhost by default — set API_BIND=0.0.0.0 (and API_KEY!) to expose it.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./outputs:/app/outputs:rw
      - ./data:/app/data:rw
      - ./apps/config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOME=/tmp  # writable whatever APP_UID is (sqlmap/wapiti keep state in $HOME)
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DOCKER_NETWORK=${DOCKER_NETWORK:-scanner-net}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-example.com}
      - ALLOW_PRIVATE_TARGETS=${ALLOW_PRIVATE_TARGETS:-false}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ZAP_HOST=zap
      - ZAP_PORT=8090
    networks:
      - scanner-net
      - zap-net
    restart: unless-stopped
    depends_on:
      zap:
        condition: service_healthy
      nuclei:
        condition: service_started
      nikto:
        condition: service_started

  # ==========================================================================
  # Security Scanners
  # ==========================================================================

  # ZAP (OWASP Zed Attack Proxy). Its API runs without a key: ZAP shares zap-net
  # with the API only, so the scanner containers on scanner-net cannot reach it.
  zap:
    image: zaproxy/zap-stable:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    container_name: security-scanner-zap
    volumes:
      - ./outputs:/zap/wrk:rw
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    networks:
      - zap-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nuclei (Vulnerability Scanner)
  nuclei:
    image: projectdiscovery/nuclei:v3.11.1@sha256:582d5546902e67052097cb2d07296c642d50a1afc5e44623cb038845df9a32eb
    container_name: security-scanner-nuclei
    # Docker Engine on Linux: lets the integration test's site on the host be reached
    # (Docker Desktop has the name already). The API refuses *.internal targets.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./outputs:/output:rw
      - nuclei-templates:/root/nuclei-templates
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    networks:
      - scanner-net
    restart: unless-stopped

  # Nikto (Web Server Scanner) — official image, amd64 and arm64. Findings are read
  # from its console output, so it needs no access to ./outputs.
  nikto:
    image: hackllc/nikto:2.6.1@sha256:f65dd97be358e8260d97a00e784c05c5f37d2ed69b9a9611b14d3889c2b54efa
    container_name: security-scanner-nikto
    # Docker Engine on Linux: lets the integration test's site on the host be reached
    # (Docker Desktop has the name already). The API refuses *.internal targets.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    networks:
      - scanner-net
    restart: unless-stopped

  # FFuf (Fuzzer)
  ffuf:
    image: secsi/ffuf:2.3.0@sha256:ee0390afbb0471c18cb6c0407191b424d86dc4ab30c04fb93b3908751a33bc5e
    container_name: security-scanner-ffuf
    volumes:
      - ./outputs:/output:rw
      - ./apps/config/wordlists:/wordlists:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["tail -f /dev/null"]
    networks:
      - scanner-net
    restart: unless-stopped
    profiles:
      - tools

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  nuclei-templates:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  scanner-net:
    name: ${DOCKER_NETWORK:-scanner-net}
    driver: bridge
  # ZAP and the API only. Attach a lab target here as well to scan it with ZAP.
  zap-net:
    name: web-check-zap
    driver: bridge
