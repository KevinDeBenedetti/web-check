[project]
name = "web-check"
version = "0.1.1"
description = "Docker-based security scanning toolkit"
authors = [
    {name = "Kevin De Benedetti", email = "contact@kevindb.dev"},
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "httpx>=0.28.1",
    "httpx-secure>=1.3.0",
    "structlog>=26.1.0",
    "sqlalchemy>=2.0.51,<2.1",
    "alembic>=1.18.4",
    "aiosqlite>=0.20.0",
    "python-owasp-zap-v2.4>=0.0.22",
    "sslyze>=6.3.1",
    "sqlmap>=1.10.6,<1.10.7",
    "typer>=0.26.7",
    "rich>=15.0.0",
    "dnspython>=2.8.0",
    "kubernetes>=36.0.2",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "urllib3>=2.7.0",
]

[project.scripts]
web-check = "cli.main:app"
my-check = "my_check.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "prek>=0.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
no-binary-package = ["sqlmap"]
# sslyze (latest: 6.3.1) caps cryptography below 47, but every release before 50
# has known vulnerabilities (pip-audit). sslyze only uses it to parse and verify
# certificates; drop this once sslyze allows a fixed cryptography.
override-dependencies = ["cryptography>=50.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api", "apps/cli", "apps/my_check"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"
python = ".venv"
python-platform = "all"
root = ["apps/api"]

[tool.ty.rules]
# Critical errors
possibly-unresolved-reference = "error"
unsupported-operator = "error"
division-by-zero = "error"

# Warnings (FastAPI/Starlette middleware typing issues)
invalid-argument-type = "warn"
unused-ignore-comment = "warn"
redundant-cast = "warn"

[tool.ty.src]
include = ["apps/api"]
exclude = ["**/__pycache__", "**/node_modules", ".venv", "outputs"]
respect-ignore-files = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]
markers = [
    "slow: marks tests as slow (deselected by default in CI)",
    "integration: marks tests as integration tests",
]
addopts = "-v"
