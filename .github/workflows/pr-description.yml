name: PR description

# Claude Code rewrites a managed block at the top of each pull request
# description, from the commits and the diff, every time the pull request is
# opened, reopened or pushed to. Text written outside that block is kept.
#
# The configuration (model, effort, language, prompt, Claude Code version)
# lives in KevinDeBenedetti/github-workflows, in pr-description.yml: change it
# there, not here. Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret, a token
# from `claude setup-token` tied to the Claude subscription; without it the job
# only prints a warning. Bot and fork pull requests are skipped. Outside the CI
# gate on purpose: a missing token or a model error must never block a merge.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  describe:
    # TEMPORARY: pr-description.yml is not on github-workflows main yet (PR #66,
    # branch feat/add-pr-description). Pinned to that branch's commit so the
    # workflow resolves; switch to @main like ci-cd.yml once #66 is merged.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/pr-description.yml@006ec9cbb57f71a5f11973eb356f1d500323f106 # feat/add-pr-description
    permissions:
      contents: read          # check out the pull request history
      pull-requests: write    # rewrite the managed block of the PR body
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
