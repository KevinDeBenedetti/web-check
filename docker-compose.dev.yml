# ==============================================================================
# Development overrides — live code reload
# ==============================================================================
# Usage: make dev
#   (= docker compose -f docker-compose.yml -f docker-compose.dev.yml up)

services:
  api:
    volumes:
      - ./apps/api:/app/api:ro
      - ./apps/alembic:/app/alembic:ro
      - ./apps/alembic.ini:/app/alembic.ini:ro
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
